o/H7kDcP6B5l2otg0af/audioblocks-source-of-inspiration-no-choir_HkaQacCUel_WM.mp3?type=preview&origin=AUDIOBLOCKS&timestamp_ms=1787519857357&apiVersion=2.0&stockItemId=352524359&resolution=&endUserId=d1b3766073980dc135badf122f43d5ad4b832c17&projectId=storyblocks-relevance-gate-2026-08&searchId=117e49c0-c567-4d92-87ed-82ac0bfd4e81&searchPageId=b0b42d55-77b3-45b6-8f56-64f2341d1dc1"},{"id":354255654,"rank":9,"title":"Echoes Of A Forgotten Empire [Alt Without Drums]","description":null,"durationMs":110000,"maxResolution":null,"aspectRatio":null,"keywords":["ambient","drums","eerie","orchestra","piano","relaxing","sad","serious","synth","trailer","Dark","Serious"],"previewUrl":"https://dm0qx8t0i9gc9.cloudfront.net/watermarks/audio/HUAu6Wx0Ikbsjtik9/audioblocks-echoes-of-a-forgotten-empire-alt-without-drums_Hognf1uhcWg_WM.mp3?type=preview&origin=AUDIOBLOCKS&timestamp_ms=1787519857358&apiVersion=2.0&stockItemId=354255654&resolution=&endUserId=d1b3766073980dc135badf122f43d5ad4b832c17&projectId=storyblocks-relevance-gate-2026-08&searchId=117e49c0-c567-4d92-87ed-82ac0bfd4e81&searchPageId=b0b42d55-77b3-45b6-8f56-64f2341d1dc1"},{"id":352746976,"rank":10,"title":"Emotional Upsurge (Piano)","description":null,"durationMs":147000,"maxResolution":null,"aspectRatio":null,"keywords":["cinematic","dark","emotional","epic","orchestra","piano","powerful","sad","victory","world","Epic","Inspiring"],"previewUrl":"https://dm0qx8t0i9gc9.cloudfront.net/watermarks/audio/H7kDcP6B5l2otg0af/audioblocks-emotional-upsurge-piano_H9TvmUD5xe_WM.mp3?type=preview&origin=AUDIOBLOCKS&timestamp_ms=1787519857359&apiVersion=2.0&stockItemId=352746976&resolution=&endUserId=d1b3766073980dc135badf122f43d5ad4b832c17&projectId=storyblocks-relevance-gate-2026-08&searchId=117e49c0-c567-4d92-87ed-82ac0bfd4e81&searchPageId=b0b42d55-77b3-45b6-8f56-64f2341d1dc1"}]}];
    const storageKey = "velto:storyblocks-visual-review:v1";
    let reviews = {};
    try { reviews = JSON.parse(localStorage.getItem(storageKey) || "{}"); } catch { reviews = {}; }

    const showDiagnostic = (error) => {
      const panel = document.querySelector("#diagnostic");
      const message = error instanceof Error ? error.message : String(error);
      const stack = error instanceof Error && error.stack ? "\n\n" + error.stack : "";
      panel.textContent = "Review board rendering failed\n\n" + message + stack;
      panel.hidden = false;
    };
    window.addEventListener("error", (event) => showDiagnostic(event.error || event.message));
    window.addEventListener("unhandledrejection", (event) => showDiagnostic(event.reason));

    const reviewEntries = (Array.isArray(entries) ? entries : []).map((entry, entryIndex) => ({
      mediaType: typeof entry?.mediaType === "string" ? entry.mediaType : "unknown",
      query: typeof entry?.query === "string" && entry.query ? entry.query : "Untitled query " + (entryIndex + 1),
      results: (Array.isArray(entry?.results) ? entry.results : []).map((result, resultIndex) => ({
        id: result?.id ?? "missing-" + entryIndex + "-" + resultIndex,
        rank: Number.isFinite(Number(result?.rank)) ? Number(result.rank) : resultIndex + 1,
        title: typeof result?.title === "string" && result.title ? result.title : "Untitled result",
        description: typeof result?.description === "string" ? result.description : null,
        durationMs: Number.isFinite(Number(result?.durationMs)) ? Number(result.durationMs) : null,
        maxResolution: result?.maxResolution ?? null,
        aspectRatio: result?.aspectRatio ?? null,
        keywords: Array.isArray(result?.keywords) ? result.keywords : [],
        previewUrl: typeof result?.previewUrl === "string" ? result.previewUrl : null,
      })),
    }));

    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (character) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[character]);
    const keyFor = (query, id) => query + "::" + id;
    const formatDuration = (milliseconds) => milliseconds == null ? "-" : (milliseconds / 1000).toFixed(1) + " sec";
    const option = (value, label, selected) => '<option value="' + value + '"' + (String(selected) === value ? " selected" : "") + '>' + label + '</option>';

    function reviewControls(entry, result) {
      const key = keyFor(entry.query, result.id);
      const review = reviews[key] || {};
      return '<div class="review" data-review-key="' + escapeHtml(key) + '">' +
        '<label>Relevance<select data-field="relevance">' + option("", "Select", review.relevance) + option("0", "0 — unusable", review.relevance) + option("1", "1 — weak", review.relevance) + option("2", "2 — usable", review.relevance) + option("3", "3 — strong", review.relevance) + '</select></label>' +
        '<label>Visual Quality<select data-field="quality">' + option("", "Select", review.quality) + option("0", "0 — unusable", review.quality) + option("1", "1 — weak", review.quality) + option("2", "2 — usable", review.quality) + option("3", "3 — strong", review.quality) + '</select></label>' +
        '<label>Production Usability<select data-field="usable">' + option("", "Select", review.usable) + option("yes", "Yes", review.usable) + option("no", "No", review.usable) + '</select></label>' +
        '<label class="note">Optional note<input data-field="note" value="' + escapeHtml(review.note || "") + '" maxlength="300"></label>' +
      '</div>';
    }

    function videoCard(entry, result) {
      const media = result.previewUrl
        ? '<video controls preload="metadata" playsinline src="' + escapeHtml(result.previewUrl) + '"></video>'
        : '<div class="empty">Preview unavailable</div>';
      return '<article class="card">' + media + '<div class="body"><h3><span class="rank">#' + result.rank + '</span> ' + escapeHtml(result.title) + '</h3>' +
        '<p class="meta">ID: ' + escapeHtml(result.id) + ' · Duration: ' + formatDuration(result.durationMs) + ' · Resolution: ' + escapeHtml(result.maxResolution || "-") + ' · Aspect: ' + escapeHtml(result.aspectRatio || "-") + ' · Keywords: ' + escapeHtml(result.keywords.length ? result.keywords.join(", ") : "-") + '</p>' +
        reviewControls(entry, result) + '</div></article>';
    }

    function compactCard(entry, result) {
      let media = '<div class="empty">Preview unavailable</div>';
      if (result.previewUrl && entry.mediaType === "images") media = '<img loading="lazy" src="' + escapeHtml(result.previewUrl) + '" alt="">';
      if (result.previewUrl && entry.mediaType === "audio") media = '<audio controls preload="metadata" src="' + escapeHtml(result.previewUrl) + '"></audio>';
      return '<article class="card compact">' + media + '<div class="body"><h3><span class="rank">#' + result.rank + '</span> ' + escapeHtml(result.title) + '</h3><p class="meta">ID: ' + escapeHtml(result.id) + ' · Duration: ' + formatDuration(result.durationMs) + ' · Resolution: ' + escapeHtml(result.maxResolution || "-") + ' · Aspect: ' + escapeHtml(result.aspectRatio || "-") + ' · Keywords: ' + escapeHtml(result.keywords.length ? result.keywords.join(", ") : "-") + '</p>' + reviewControls(entry, result) + '</div></article>';
    }

    function render() {
      const videos = reviewEntries.filter((entry) => entry.mediaType === "videos");
      const secondary = reviewEntries.filter((entry) => entry.mediaType !== "videos");
      document.querySelector("#app").innerHTML =
        '<h2>Video review</h2>' + videos.map((entry) => '<section data-query="' + escapeHtml(entry.query) + '"><h2>' + escapeHtml(entry.query) + '</h2><p class="query-summary" data-query-summary>0 production-usable of 0 reviewed</p>' + (entry.results.length ? '<div class="grid">' + entry.results.map((result) => videoCard(entry, result)).join("") + '</div>' : '<div class="empty">No results returned.</div>') + '</section>').join("") +
        '<h2>Image and audio reference</h2>' + secondary.map((entry) => '<section><h2>' + entry.mediaType.toUpperCase() + ': ' + escapeHtml(entry.query) + '</h2>' + (entry.results.length ? '<div class="grid">' + entry.results.map((result) => compactCard(entry, result)).join("") + '</div>' : '<div class="empty">No results returned.</div>') + '</section>').join("");
      bindReviewControls();
      updateMetrics();
    }

    function bindReviewControls() {
      document.querySelectorAll("[data-review-key]").forEach((container) => {
        container.querySelectorAll("select,input").forEach((control) => control.addEventListener("input", () => {
          const key = container.dataset.reviewKey;
          reviews[key] ||= {};
          reviews[key][control.dataset.field] = control.value;
          localStorage.setItem(storageKey, JSON.stringify(reviews));
          updateMetrics();
        }));
      });
    }

    function completedReviews() {
      return reviewEntries.flatMap((entry) => entry.results.map((result) => ({ entry, result, review: reviews[keyFor(entry.query, result.id)] || {} }))).filter(({ review }) => review.relevance !== undefined && review.relevance !== "" && review.quality !== undefined && review.quality !== "" && (review.usable === "yes" || review.usable === "no"));
    }

    function updateMetrics() {
      const videoEntries = reviewEntries.filter((entry) => entry.mediaType === "videos");
      const total = reviewEntries.reduce((sum, entry) => sum + entry.results.length, 0);
      const completed = completedReviews();
      const relevance = completed.length ? completed.reduce((sum, item) => sum + Number(item.review.relevance), 0) / completed.length : null;
      const quality = completed.length ? completed.reduce((sum, item) => sum + Number(item.review.quality), 0) / completed.length : null;
      const usableCount = completed.filter((item) => item.review.usable === "yes").length;
      const usablePercent = completed.length ? usableCount / completed.length * 100 : null;
      document.querySelector("#reviewed").textContent = completed.length + " / " + total;
      document.querySelector("#relevance").textContent = relevance == null ? "—" : relevance.toFixed(2);
      document.querySelector("#quality").textContent = quality == null ? "—" : quality.toFixed(2);
      document.querySelector("#usable").textContent = usablePercent == null ? "—" : usablePercent.toFixed(1) + "%";
      const queryCounts = videoEntries.map((entry) => {
        const reviewed = completed.filter((item) => item.entry.query === entry.query);
        const usable = reviewed.filter((item) => item.review.usable === "yes").length;
        const section = [...document.querySelectorAll("section[data-query]")].find((item) => item.dataset.query === entry.query);
        if (section) section.querySelector("[data-query-summary]").textContent = usable + " production-usable of " + reviewed.length + " reviewed";
        return entry.query + ": " + usable;
      });
      document.querySelector("#per-query").textContent = queryCounts.map((item) => item.split(": ").at(-1)).join(" / ");
      document.querySelector("#per-query").title = queryCounts.join("\n");
      const passes = completed.length > 0 && usablePercent >= 70 && relevance >= 2 && quality >= 2;
      const gate = document.querySelector("#gate");
      gate.className = "gate " + (passes ? "pass" : "fail");
      gate.querySelector("strong").textContent = passes ? "PASS candidate" : "NEEDS REVIEW / FAIL candidate";
    }

    document.querySelector("#export").addEventListener("click", () => {
      const output = reviewEntries.flatMap((entry) => entry.results.map((result) => {
        const review = reviews[keyFor(entry.query, result.id)] || {};
        return { query: entry.query, resultId: result.id, rank: result.rank, title: result.title, relevanceScore: review.relevance === "" || review.relevance === undefined ? null : Number(review.relevance), visualQualityScore: review.quality === "" || review.quality === undefined ? null : Number(review.quality), productionUsability: review.usable || null, note: review.note || "" };
      }));
      const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), reviews: output }, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "storyblocks-visual-review.json";
      link.click();
      URL.revokeObjectURL(link.href);
    });

    try {
      render();
    } catch (error) {
      showDiagnostic(error);
    }
  </script>
