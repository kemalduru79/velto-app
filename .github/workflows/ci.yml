name: Velto CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "agent/**"
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      # Public, non-production placeholders used only so Next.js can prerender
      # modules that initialize the browser Supabase client during build.
      # They are not credentials and do not point to a live Supabase project.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: P0 quality gate contracts
        run: node scripts/p0-quality-gate-test.mjs

      - name: Reconstruct reviewed Sprint 20 staged snapshot for CI
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/p0-sprint20-controlled-integration'
        shell: bash
        run: |
          set -euo pipefail
          REVIEWED_BASE=ba55a5bdc65d9016f88f65b6411de35c9acbff97
          APPROVED_CANDIDATE=bc30a72440cfbeaafa5c3aac283bdaa5efd70656
          TARGET="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET"
          git cat-file -e "$REVIEWED_BASE^{commit}"
          git cat-file -e "$APPROVED_CANDIDATE^{commit}"
          git merge-base --is-ancestor "$REVIEWED_BASE" "$APPROVED_CANDIDATE"
          git merge-base --is-ancestor "$APPROVED_CANDIDATE" "$TARGET"
          reviewed_count="$(git diff --name-only "$REVIEWED_BASE" "$APPROVED_CANDIDATE" -- | wc -l | tr -d '[:space:]')"
          test "$reviewed_count" = 115
          expected_changes="$(printf '%s\n' '.github/workflows/ci.yml' 'vercel.json' | LC_ALL=C sort)"
          actual_changes="$(git diff --name-only "$APPROVED_CANDIDATE" "$TARGET" -- | LC_ALL=C sort)"
          test "$actual_changes" = "$expected_changes" || {
            echo "STOP: unexpected post-candidate changes" >&2; exit 1;
          }
          # The exact deployment guard stays on the remote branch; it is not
          # part of the protected 115-file candidate being quality-tested.
          test "$(git rev-parse "$TARGET:vercel.json")" = 43a6b0177a66736c3bccceafda9f0c8c9210f92b
          echo "ORIGINAL_BRANCH_DEPLOYMENT_GUARD=PINNED_PASS"
          git checkout --detach "$REVIEWED_BASE"
          git diff --binary --no-ext-diff "$REVIEWED_BASE" "$APPROVED_CANDIDATE" | git apply --index
          git diff --cached --quiet "$APPROVED_CANDIDATE" --
          test ! -e vercel.json
          git diff --cached --check
          echo "TEST_SNAPSHOT_EXCLUDES_INTEGRATION_GUARD=PASS"
          printf '{"before":"%s"}\n' "$REVIEWED_BASE" > "$RUNNER_TEMP/sprint20-reviewed-lint-event.json"
          echo "P0_REVIEWED_LINT_EVENT_PATH=$RUNNER_TEMP/sprint20-reviewed-lint-event.json" >> "$GITHUB_ENV"
          echo "REVIEWED_SPRINT20_SNAPSHOT=PASS BASE=$REVIEWED_BASE CANDIDATE=$APPROVED_CANDIDATE"
          echo "PROTECTED_115_SOURCE_FILES=UNCHANGED"

      - name: No new lint debt
        if: github.event_name != 'push' || github.ref != 'refs/heads/codex/p0-sprint20-controlled-integration'
        run: npm run lint:changed

      - name: Reviewed Sprint 20 no-new-lint-debt against exact baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/p0-sprint20-controlled-integration'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${P0_REVIEWED_LINT_EVENT_PATH:-}"
          test -f "$P0_REVIEWED_LINT_EVENT_PATH"
          GITHUB_EVENT_PATH="$P0_REVIEWED_LINT_EVENT_PATH" npm run lint:changed

      - name: Critical offline regressions
        run: npm run test:ci-critical

      - name: Production build
        run: npm run build

      - name: CI contract
        run: npm run test:ci-contract
