name: Issue50 two-turn full-script refinement offline HTTP acceptance
on:
  push:
    branches: [codex/issue50-iterative-two-turn-offline-v1]
permissions:
  contents: read
jobs:
  iterative-refinement:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.4
      - name: Verify isolated files and unchanged release gates
        shell: bash
        run: |
          set -euo pipefail
          BASE=bdd183d5ef5b7c90ee35ed06912be5ea2a0ca7c7
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- lib/creator/creatorScriptRevisions.ts lib/creator/creatorScriptEditorialRewrite.ts lib/creator/creatorScriptEditorialRewriteProviders.server.ts
          git diff --exit-code "$BASE" HEAD -- scripts/quality docs/admission lib/creator/scientificReview
          test "$(git diff --name-only "$BASE" HEAD | wc -l | tr -d ' ')" = 7
          test -z "${OPENAI_API_KEY:-}"
      - name: Install unchanged locked dependencies
        run: npm ci
      - name: Iterative in-script refinement acceptance tests (no provider)
        run: |
          node scripts/issue50-iterative-refinement-ux-test.mjs
          node --experimental-strip-types scripts/stage-0-13e-ai-script-refinement-test.mjs
          node --experimental-strip-types scripts/creator-script-refinement-r2-research-backed-test.mjs
      - name: TypeScript and changed-line lint
        run: |
          npm run typecheck
          npm run lint:changed
      - name: Confirm no release or live call
        run: echo "ISSUE50_TWO_TURN_OFFLINE_HTTP_ONLY_NO_LIVE_PROVIDER_NO_DEPLOY"
