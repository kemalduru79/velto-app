name: Velto Script Quality Offline Acceptance

# Isolated acceptance for the already-reviewed source. This does not replace,
# skip, disable, or claim success for the separate scientific runtime CI gate.
on:
  push:
    branches:
      - codex/p0-sprint20-controlled-integration

permissions:
  contents: read

concurrency:
  group: velto-script-quality-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regressions:
    name: Full critical offline regression (Ubuntu Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-public-placeholder"
    steps:
      - name: Check out reviewed source without credentials
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact post-integration change scope and Vercel branch guard
        shell: bash
        run: |
          set -euo pipefail
          BASE=428286d32dfe0ecc3013f0e2b478acf75a77c98b
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          expected="$(printf '%s\n' \
            '.github/workflows/script-quality-offline-acceptance.yml' \
            'scripts/creator-script-refinement-r1-foundation-test.mjs' \
            'scripts/stage-0-8d-b-provider-environment-test.mjs' \
            'lib/research/editorialPrimaryCoverageRepair.ts' \
            'scripts/stage-0-18a6l-primary-coverage-augmentation-test.mjs' \
            'app/api/creator-editorial-analysis/route.ts' \
            'lib/research/editorialClaimOriginRepairRollback.ts' \
            'scripts/creator-editorial-claim-origin-repair-rollback-test.mjs' \
            'lib/creator/creatorScript.ts' \
            'app/api/creator-script-plan/route.ts' \
            'scripts/creator-compact-duration-repair-regression-test.mjs' | LC_ALL=C sort)"
          actual="$(git diff --name-only "$BASE" HEAD -- | LC_ALL=C sort)"
          test "$actual" = "$expected" || {
            echo "STOP: source change scope deviated from the reviewed eleven-file patch" >&2
            exit 1
          }
          node -e 'const v=require("./vercel.json");if(v.git?.deploymentEnabled?.["codex/p0-sprint20-controlled-integration"]!==false)process.exit(1)'
          echo "SOURCE_SCOPE_ELEVEN_FILES=PASS; VERCEL_BRANCH_AUTODEPLOY=DISABLED"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Confirm Docker Compose CLI availability (no daemon required)
        run: docker compose version

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Regression - 15-source canonical primary coverage budget
        run: node --experimental-strip-types scripts/stage-0-18a6l-primary-coverage-augmentation-test.mjs

      - name: Regression - additive claim-origin disagreement cannot downgrade primary authority
        run: node --experimental-strip-types scripts/creator-editorial-claim-origin-repair-rollback-test.mjs

      - name: Regression - compact three-minute duration geometry and local repair
        run: node --experimental-strip-types scripts/creator-compact-duration-repair-regression-test.mjs

      - name: Run full critical offline regression suite
        id: regression
        run: npm run test:ci-critical

      # Diagnostic only: never masks the original failing gate or scientific CI.
      # Enumerates the remaining scripts instead of stopping on the next legacy mismatch.
      - name: Diagnose remaining offline regressions after first failure
        if: ${{ failure() && steps.regression.outcome == 'failure' }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const code = fs.readFileSync('scripts/stage-0-8a-critical-regression.mjs', 'utf8');
          const match = code.match(/const tests = \[([\s\S]*?)\];/);
          if (!match) throw new Error('TEST_REGISTRY_PARSE_FAILED');
          const tests = [...match[1].matchAll(/^\s*"([^"]+\.mjs)",\s*$/gm)].map(v => v[1]);
          if (tests.length !== 121 || new Set(tests).size !== tests.length) throw new Error('TEST_REGISTRY_COUNT_OR_IDENTITY_DRIFT');
          const parts = code.split('? ["--experimental-strip-types"]');
          if (parts.length !== 2) throw new Error('TEST_FLAG_REGISTRY_DRIFT');
          const strip = new Set([...parts[0].matchAll(/test === "([^"]+)"/g)].map(v => v[1]));
          const transformPart = parts[1].split('? ["--experimental-transform-types"]');
          if (transformPart.length !== 2) throw new Error('TEST_FLAG_REGISTRY_DRIFT');
          const transform = new Set([...transformPart[0].matchAll(/test === "([^"]+)"/g)].map(v => v[1]));
          if ([...strip, ...transform].some(p => !tests.includes(p))) throw new Error('UNKNOWN_TEST_FLAG_SOURCE');
          const first = tests.indexOf('scripts/stage-0-8d-b-provider-environment-test.mjs');
          if (first < 0) throw new Error('DIAGNOSTIC_START_FILE_MISSING');
          const failures = [];
          for (const [i, file] of tests.entries()) {
            if (i < first) continue;
            const flags = strip.has(file) ? ['--experimental-strip-types'] : transform.has(file) ? ['--experimental-transform-types'] : [];
            const result = spawnSync(process.execPath, [...flags, file], {
              encoding: 'utf8', timeout: 150000, killSignal: 'SIGKILL',
              maxBuffer: 4 * 1024 * 1024,
            });
            const ok = result.status === 0 && result.error == null && result.signal == null;
            console.log('OFFLINE_CASE ' + (i + 1) + '/' + tests.length + ' ' + (ok ? 'PASS ' : 'FAIL ') + file);
            if (!ok) {
              failures.push({ index: i + 1, file, status: result.status, signal: result.signal,
                error: result.error?.code || null });
              const output = String(result.stderr || result.stdout || '');
              console.log('FAILURE_TAIL ' + file + '\n' + output.split(/\r?\n/).slice(-15).map(line => line.slice(0, 300)).join('\n'));
            }
          }
          const summary = { sourceSha: process.env.GITHUB_SHA, registryCount: tests.length,
            diagnosticFrom: first + 1, diagnosed: tests.length - first, failures };
          fs.writeFileSync('script-quality-offline-diagnostic.json', JSON.stringify(summary, null, 2) + '\n');
          console.log('CRITICAL_OFFLINE_DIAGNOSTIC_SUMMARY=' + JSON.stringify(summary));
          if (failures.length) process.exitCode = 1;
          NODE

      - name: Upload non-secret regression diagnostics
        if: ${{ always() && steps.regression.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: velto-critical-regression-diagnostics
          path: script-quality-offline-diagnostic.json
          if-no-files-found: ignore
          retention-days: 7

  production-build-parity:
    name: Vercel production build parity (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-public-placeholder"
    steps:
      - name: Check out guarded release candidate without credentials
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate and non-deployment guard
        shell: bash
        run: |
          set -euo pipefail
          BASE=428286d32dfe0ecc3013f0e2b478acf75a77c98b
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          expected="$(printf '%s\n' \
            '.github/workflows/script-quality-offline-acceptance.yml' \
            'scripts/creator-script-refinement-r1-foundation-test.mjs' \
            'scripts/stage-0-8d-b-provider-environment-test.mjs' \
            'lib/research/editorialPrimaryCoverageRepair.ts' \
            'scripts/stage-0-18a6l-primary-coverage-augmentation-test.mjs' \
            'app/api/creator-editorial-analysis/route.ts' \
            'lib/research/editorialClaimOriginRepairRollback.ts' \
            'scripts/creator-editorial-claim-origin-repair-rollback-test.mjs' \
            'lib/creator/creatorScript.ts' \
            'app/api/creator-script-plan/route.ts' \
            'scripts/creator-compact-duration-repair-regression-test.mjs' | LC_ALL=C sort)"
          actual="$(git diff --name-only "$BASE" HEAD -- | LC_ALL=C sort)"
          test "$actual" = "$expected"
          node -e 'const v=require("./vercel.json"); if(v.git?.deploymentEnabled?.["codex/p0-sprint20-controlled-integration"]!==false)process.exit(1)'
          echo "EXACT_GUARDED_SOURCE_AND_BRANCH_DEPLOY_EXCLUSION=PASS"

      - name: Use Vercel configured Node 24.x
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies (no provider credentials)
        run: npm ci --no-audit --no-fund

      - name: TypeScript on Node 24
        run: npm run typecheck

      - name: Production build on Node 24
        run: npm run build

      - name: Verify CI contract on Node 24
        run: npm run test:ci-contract
