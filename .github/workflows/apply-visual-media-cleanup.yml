name: Apply Visual Media Cleanup

on:
  push:
    branches:
      - agent/stage-0-8-production-portability
    paths:
      - ".github/workflows/apply-visual-media-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Apply Visual cleanup patch
        run: node scripts/apply-visual-media-cleanup-patch.mjs

      - name: TypeScript
        run: npm run typecheck

      - name: Critical offline regressions
        run: npm run test:ci-critical

      - name: Production build
        run: npm run build

      - name: Diff safety
        run: git diff --check

      - name: Commit integrated UX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/create/page.tsx
          git rm .github/workflows/apply-visual-media-cleanup.yml scripts/apply-visual-media-cleanup-patch.mjs
          git commit -m "Move media cleanup into Visuals"
          git push origin HEAD:agent/stage-0-8-production-portability
