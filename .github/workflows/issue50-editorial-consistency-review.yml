name: Issue50 quality consistency isolated review (not source admission)
on:
  push:
    branches: [codex/issue50-editorial-consistency-review-v1]
permissions:
  contents: read
jobs:
  consistency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.4
      - name: Confirm bounded source-only review
        shell: bash
        run: |
          set -euo pipefail
          BASE=f1ed7990c5da4cf9670b3dda5d49b3ae69079d7b
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- lib/creator/creatorScript.ts
          git diff --exit-code "$BASE" HEAD -- scripts/quality lib/creator/scientificReview docs/admission
          test "$(git diff --name-only "$BASE" HEAD | wc -l | tr -d ' ')" = 3
          test -z "${OPENAI_API_KEY:-}"
          test -z "${GH_TOKEN:-}"
      - name: Install frozen application dependencies
        run: npm ci
      - name: Existing Editorial Agent and new density regression
        run: |
          node --experimental-strip-types scripts/issue50-editorial-offline-test.mjs
          node --experimental-strip-types scripts/issue50-provider-contract-test.mjs
          node --experimental-strip-types scripts/post-strategy-script-long-form-acceptance-test.mjs
      - name: Candidate-only TypeScript and changed-file lint
        run: |
          npm run typecheck
          npm run lint:changed
      - name: No source admission or production release performed
        run: |
          echo "ISSUE50_CONSISTENCY_REVIEW_ONLY_NO_LIVE_MODEL_NO_DEPLOY"
