services:
  velto:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      TMPDIR: "/tmp"
      HOME: "/tmp"
      XDG_CACHE_HOME: "/tmp/.cache"
      VELTO_DATABASE_DRIVER: "${VELTO_DATABASE_DRIVER:-supabase}"
      VELTO_STORAGE_DRIVER: "${VELTO_STORAGE_DRIVER:-supabase}"
    ports:
      - "${VELTO_HOST_PORT:-3000}:3000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/runtime-health?mode=ready').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      - NODE_ENV=production
      - HOME=/tmp
      - XDG_CACHE_HOME=/tmp/.cache
      - SUPABASE_URL
      - NEXT_PUBLIC_SUPABASE_URL
      - SUPABASE_SERVICE_ROLE_KEY
      - VELTO_INTERNAL_WORKER_TOKEN
      - VELTO_INTERNAL_BASE_URL=${VELTO_INTERNAL_BASE_URL:-http://velto:3000}
      - VELTO_WORKER_ID
      - VELTO_QUEUE_POLL_MS
      - VELTO_QUEUE_LEASE_SECONDS
      - VELTO_QUEUE_HEARTBEAT_MS
      - VELTO_WORKER_HEARTBEAT_MS
      - VELTO_QUEUE_RETRY_BASE_SECONDS
      - VELTO_QUEUE_RETRY_MAX_SECONDS
      - VELTO_FIN_RECONCILE_INTERVAL_MS
      - VELTO_FIN_RECONCILE_BATCH_LIMIT
      - VELTO_FIN_STALE_JOB_MINUTES
      - VELTO_RELEASE
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 90s
    restart: unless-stopped
    depends_on:
      velto:
        condition: service_healthy
