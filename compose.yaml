services:
  velto:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      TMPDIR: "/tmp"
      HOME: "/tmp"
      XDG_CACHE_HOME: "/tmp/.cache"
      VELTO_DATABASE_DRIVER: "${VELTO_DATABASE_DRIVER:-supabase}"
      VELTO_STORAGE_DRIVER: "${VELTO_STORAGE_DRIVER:-supabase}"
    ports:
      - "${VELTO_HOST_PORT:-3000}:3000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/runtime-health?mode=ready').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      HOME: "/tmp"
      XDG_CACHE_HOME: "/tmp/.cache"
      VELTO_INTERNAL_BASE_URL: "http://velto:3000"
      VELTO_QUEUE_POLL_MS: "2000"
      VELTO_QUEUE_LEASE_SECONDS: "60"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 90s
    restart: unless-stopped
    depends_on:
      velto:
        condition: service_healthy
